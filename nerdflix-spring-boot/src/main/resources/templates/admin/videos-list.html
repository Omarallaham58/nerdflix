<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin | Videos</title>
    <meta charset="UTF-8">

    <th:block th:replace="~{admin/adminHeader :: adminHeaderStyles}"></th:block>

    <style>
        .container {
            max-width: 1050px;
            margin: 40px auto;
            background: #181818;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
        }

        .page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #222;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .btn-upload {
            display: inline-block;
            background: #e50914;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: background 0.2s;
        }
        .btn-upload:hover { background: #f6121d; text-decoration: none; color: #fff; }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-success { background: #0f5132; color: #a3ffcc; }
        .alert-error   { background: #5a1a1a; color: #ff9b9b; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        thead { background: #111; }

        th, td { padding: 12px 14px; text-align: left; }

        th {
            color: #bbb;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
        }

        td {
            border-bottom: 1px solid #333;
            color: #ddd;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #1f1f1f; }

        .thumbnail {
            width: 90px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333;
            display: block;
        }

        .text-muted { color: #666; font-size: 13px; }

        .action-buttons { display: flex; gap: 8px; align-items: center; }
        .action-buttons form { margin: 0; }

        .btn-edit {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .btn-edit:hover {
            background: #2a2a2a;
            border-color: #666;
            color: #fff;
            text-decoration: none;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid rgba(229,9,20,0.35);
            color: #e50914;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-delete:hover {
            background: rgba(229,9,20,0.12);
            border-color: #e50914;
        }
    </style>
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader}"></div>

<div class="container">

    <div class="page-header">
        <h2>Videos</h2>
        <a th:href="@{/admin/upload}" class="btn-upload">+ Upload New Video</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <table>
        <thead>
        <tr>
            <th></th>
            <th>Title</th>
            <th>Description</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="video : ${videos}">
            <td>
                <img th:src="@{/thumbnails/{id}.jpg(id=${video.id})}"
                     class="thumbnail" alt="thumbnail"/>
            </td>
            <td th:text="${video.title}"></td>
            <td class="text-muted" th:text="${video.description}"></td>
            <td th:text="${video.category.name}"></td>
            <td>
                <div class="action-buttons">
                    <a th:href="@{/admin/videos/{id}(id=${video.id})}" class="btn-edit">Edit</a>
                    <form th:action="@{/admin/videos/delete/{id}(id=${video.id})}" method="post">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
