<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin | Upload Video</title>
    <meta charset="UTF-8">

    <th:block th:replace="~{admin/adminHeader :: adminHeaderStyles}"></th:block>

    <style>
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #181818;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #222;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .btn-back {
            font-size: 13px;
            color: #e50914;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-back:hover { text-decoration: underline; }

        label {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #bbb;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus { border-color: #e50914; }

        select option { background: #222; color: #fff; }

        textarea { resize: vertical; min-height: 90px; }

        /* Upload box */
        .upload-box {
            display: block;
            border: 2px dashed #444;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
            transition: border-color 0.3s, background 0.3s;
        }
        .upload-box:hover { border-color: #e50914; background: #1f1f1f; }

        .upload-box .icon {
            font-size: 36px;
            color: #e50914;
            display: block;
            margin-bottom: 8px;
            line-height: 1;
        }
        .upload-box .upload-text { font-size: 14px; color: #aaa; }

        input[type="file"] { display: none; }

        .file-name { margin-top: 8px; font-size: 13px; color: #666; }

        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #0f5132; color: #a3ffcc; }
        .alert-error   { color: #ff5c5c; font-size: 13px; margin-top: 4px; }

        .btn-submit {
            margin-top: 26px;
            width: 100%;
            background: #e50914;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        .btn-submit:hover    { background: #f6121d; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Processing overlay */
        .processing-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .processing-overlay.active { display: flex; }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .processing-text { color: #fff; font-size: 17px; letter-spacing: 1px; }
    </style>

    <script>
        function showFileName(input) {
            const name = input.files.length > 0 ? input.files[0].name : "No file selected";
            document.getElementById("file-name").innerText = name;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const form    = document.getElementById("uploadForm");
            const btn     = document.getElementById("submitBtn");
            const overlay = document.getElementById("processingOverlay");

            form.addEventListener("submit", () => {
                overlay.classList.add("active");
                btn.innerText = "Processing...";
                btn.disabled  = true;
            });
        });
    </script>
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader}"></div>

<div id="processingOverlay" class="processing-overlay">
    <div class="spinner"></div>
    <div class="processing-text">Processing video… please wait</div>
</div>

<div class="container">

    <div class="page-header">
        <h2>Upload Video</h2>
        <a th:href="@{/admin/videos}" class="btn-back">← Back</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <form id="uploadForm"
          th:action="@{/admin/upload}"
          th:object="${videoForm}"
          method="post"
          enctype="multipart/form-data">

        <label>Title</label>
        <input type="text" th:field="*{title}" placeholder="Enter video title">
        <div class="alert-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

        <label>Description</label>
        <textarea th:field="*{description}" placeholder="Enter video description"></textarea>

        <label>Category</label>
        <select th:field="*{categoryId}">
            <option value="">-- Select Category --</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <div class="alert-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>

        <label>Video File</label>
        <label class="upload-box">
            <span class="icon">+</span>
            <span class="upload-text">Click to select a video file</span>
            <input type="file" th:field="*{file}" accept="video/*" onchange="showFileName(this)">
        </label>
        <div class="file-name" id="file-name">No file selected</div>
        <div class="alert-error" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></div>

        <button id="submitBtn" type="submit" class="btn-submit">Start Upload</button>

    </form>
</div>

</body>
</html>
