spring.application.name=nerdflix

# Secrets are read from environment variables (see .env.example). Nothing secret is stored in this file.

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ilog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=nerdflix


# Configure Hibernate DDL (Data Definition Language) behavior
# 'update' updates the schema to match entities; other options include 'create', 'create-drop', 'validate', 'none'
spring.jpa.hibernate.ddl-auto=none

# Optional: show SQL queries in the console
spring.jpa.show-sql=true

# Object storage (Backblaze B2, S3-compatible API)
r2.endpoint=${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
r2.access-key=${B2_ACCESS_KEY_ID}
r2.secret-key=${B2_SECRET_ACCESS_KEY}
r2.bucket=${B2_BUCKET}

# AES-128 key for HLS encryption: 32 hex characters
video.encryption-key=${VIDEO_ENCRYPTION_KEY}
video.temp-dir=/tmp/videos
video.hls.segment-duration=4
video.hls.key-validity-seconds=60
# Enable multipart upload
spring.servlet.multipart.enabled=true

# Max size per uploaded file
spring.servlet.multipart.max-file-size=2GB

# Max size per request (file + form data)
spring.servlet.multipart.max-request-size=2GB

# Threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=10MB

## JWT Configuration
jwt.secret=${JWT_SECRET}
#expiration in milliseconds (900000 ms <=> 900s <=> 15 minutes)
jwt.expiration=900000
jwt.issuer=nerdflix-backend
# refreshToken expiration: 7 days
jwt.refresh-expiration=604800000

logging.level.org.springframework.security=TRACE

# Cloudflare Worker that serves the HLS streams
worker.base-url=${WORKER_BASE_URL:http://localhost:8787}
worker.token-secret=${WORKER_TOKEN_SECRET}
worker.token-ttl-seconds=1800
